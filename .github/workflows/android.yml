name: Android mobile checks
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: ./tool/check.sh
      - run: ./tool/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smart-choice-mobile-debug
          path: dist/smart-choice-mobile-debug.apk
          if-no-files-found: error
