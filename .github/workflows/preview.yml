name: Live interface preview
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: ./tool/check.sh
      - uses: actions/configure-pages@v5
      - name: Build shared Flutter interface
        run: ./tool/build-preview.sh --base-href /mobile.justsmartchoice.com/ --dart-define=PREVIEW_COMMIT=${GITHUB_SHA:0:7} --dart-define=PREVIEW_DATE="$(date -u +%Y-%m-%dT%H:%MZ)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
