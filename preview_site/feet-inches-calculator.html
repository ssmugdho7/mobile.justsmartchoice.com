    <script>
      // Fraction helper functions
      function gcd(a, b){ return b ? gcd(b, a % b) : a; }
      function simplifyFraction(numer, denom){
        let g = gcd(numer, denom);
        return [numer/g, denom/g];
      }

      function parseFraction(input){
        input = input.trim();
        if(!input) return 0;
        let mixed = input.split(' ');
        if(mixed.length === 2){ // e.g., 1 3/4
          let whole = parseInt(mixed[0]) || 0;
          let frac = mixed[1].split('/');
          if(frac.length === 2) return whole + parseInt(frac[0])/parseInt(frac[1]);
        } else if(mixed.length === 1){ // fraction only or whole number
          if(input.includes('/')){
            let frac = input.split('/');
            if(frac.length === 2) return parseInt(frac[0])/parseInt(frac[1]);
          } else return parseFloat(input);
        }
        return 0;
      }

      function toMixedNumber(value){
        let feet = Math.floor(value/12);
        let inches = value % 12;
        let whole = Math.floor(inches);
        let frac = inches - whole;
        if(frac === 0) return {feet: feet, inches: whole, frac: null};
        let denom = 64; // max denominator for precision
        let numer = Math.round(frac * denom);
        let [simplifiedNum, simplifiedDenom] = simplifyFraction(numer, denom);
        return {feet: feet, inches: whole, frac: [simplifiedNum, simplifiedDenom]};
      }

      function calculateFeetInches(){
        let f1 = parseInt(document.getElementById('feet1').value) || 0;
        let f2 = parseInt(document.getElementById('feet2').value) || 0;
        let i1 = parseFraction(document.getElementById('inches1').value);
        let i2 = parseFraction(document.getElementById('inches2').value);
        let op = document.getElementById('operation').value;

        let total1 = f1*12 + i1;
        let total2 = f2*12 + i2;
        let resultInches = 0;

        switch(op){
          case '+': resultInches = total1 + total2; break;
          case '-': resultInches = total1 - total2; break;
          case '*': resultInches = total1 * total2; break;
          case '/': resultInches = total1 / total2; break;
        }

        let mixed = toMixedNumber(resultInches);
        let fracStr = mixed.frac ? `${mixed.frac[0]}/${mixed.frac[1]}` : '';
        let answer = `${mixed.feet} ft ${mixed.inches}${fracStr ? ' '+fracStr : ''} in`;

        document.getElementById('results').innerHTML = `<b>Answer:</b> ${answer}`;
      }
    </script>
