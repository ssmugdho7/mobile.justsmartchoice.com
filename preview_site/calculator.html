    <script>
      let display = document.getElementById("display");
      let memory = 0;

      function appendNumber(num) { display.value += num; }
      function appendOperator(op) { display.value += " " + op + " "; }
      function appendDot() { if (!display.value.endsWith(".")) display.value += "."; }
      function clearEntry() { display.value = ""; }
      function clearAll() { display.value = ""; memory = 0; }
      function backspace() { display.value = display.value.slice(0, -1); }
      function toggleSign() { if(display.value) display.value = -parseFloat(display.value); }
      function sqrt() { display.value = Math.sqrt(parseFloat(display.value)); }
      function percentage() { display.value = parseFloat(display.value) / 100; }
      function insertPi() { display.value += Math.PI.toFixed(10); }
      function power() { display.value += " ** "; }
      function round2() { display.value = parseFloat(display.value).toFixed(2); }
      function round0() { display.value = parseFloat(display.value).toFixed(0); }
      function calculate() { try { display.value = eval(display.value); } catch { display.value = "Error"; } }

      // Memory functions
      function memoryClear() { memory = 0; }
      function memoryRecall() { display.value += memory; }
      function memoryPlus() { memory += parseFloat(display.value || 0); }
      function memoryMinus() { memory -= parseFloat(display.value || 0); }
    </script>
