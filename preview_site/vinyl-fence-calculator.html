    <script>
      function generateGateWidths() {
        const container = document.getElementById("gateWidthsContainer");
        const numGates = parseInt(document.getElementById("numGates").value) || 0;
        let html = "";
        for(let i=1; i<=numGates; i++){
          html += `<label>Width of Gate ${i} (ft):</label><input type="number" id="gateWidth${i}" placeholder="Width of gate ${i}">`;
        }
        container.innerHTML = html;
      }

      function calculateFence() {
        const lineal = parseFloat(document.getElementById("linealFeet").value) || 0;
        const inside = parseInt(document.getElementById("insideCorners").value) || 0;
        const outside = parseInt(document.getElementById("outsideCorners").value) || 0;
        const gates = parseInt(document.getElementById("numGates").value) || 0;

        let totalGateWidth = 0;
        for(let i=1; i<=gates; i++){
          totalGateWidth += parseFloat(document.getElementById(`gateWidth${i}`).value) || 0;
        }

        const postSpacing = 8; // typical spacing between posts in ft
        const picketsPerFt = 1; // adjust depending on style (1 picket per foot)

        // Posts
        let totalPosts = Math.ceil(lineal / postSpacing) + inside + outside + gates * 2;

        // Pickets
        let totalPickets = Math.ceil(lineal * picketsPerFt);

        // Bottom & Top rails (2 per section)
        let totalRails = totalPosts * 2;

        // Post caps
        let totalCaps = totalPosts;

        // Gate planks
        let gatePlanks = Math.ceil(totalGateWidth * picketsPerFt);

        // Total pickets including gates
        let totalPicketsAll = totalPickets + gatePlanks;

        document.getElementById("results").innerHTML =
          `<b>Total Posts Needed:</b> ${totalPosts}<br>` +
          `<b>Total Pickets Needed:</b> ${totalPicketsAll}<br>` +
          `<b>Total Rails (top & bottom):</b> ${totalRails}<br>` +
          `<b>Total Post Caps:</b> ${totalCaps}<br>` +
          `<b>Total Gates:</b> ${gates}`;
      }
    </script>
