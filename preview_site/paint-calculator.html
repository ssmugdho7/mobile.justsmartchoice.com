    <script>
      function calculatePaint() {
        const length = parseFloat(document.getElementById("wallLength").value) || 0;
        const height = parseFloat(document.getElementById("wallHeight").value) || 0;
        const walls = parseInt(document.getElementById("numWalls").value) || 1;
        const type = document.getElementById("wallType").value;
        const method = document.getElementById("method").value;

        let totalArea = length * height * walls;

        // Paint coverage
        let coverage = (type === "interior") ? 350 : 250; // sq ft per gallon
        if(method === "sprayer") coverage *= 1.1; // Sprayer efficiency adjust

        let gallons = Math.ceil(totalArea / coverage);

        // Time calculation (hours)
        let rate = (method === "roller") ? 100 : 200; // sq ft per hour
        let hours = totalArea / rate;

        document.getElementById("results").innerHTML =
          `<b>Total Wall Area:</b> ${totalArea.toFixed(2)} sq ft<br>` +
          `<b>Gallons of Paint Needed:</b> ${gallons} gallon(s)<br>` +
          `<b>Estimated Time:</b> ${hours.toFixed(2)} hours`;
      }
    </script>
